---
flatpak_remote_name: "flathub"
flatpak_remote_url: "https://flathub.org/repo/flathub.flatpakrepo"
# Atualizacao automatica de Flatpaks: passo no provisionamento + timer systemd
# (diario e no boot). Desative com desktop_apps_flatpak_autoupdate_enable: false.
desktop_apps_flatpak_autoupdate_enable: true
desktop_apps_flatpak_update_oncalendar: "daily"
desktop_apps_flatpak_update_onbootsec: "3min"
postman_deb_url: ""
postman_deb_package_name: ""
desktop_apps_vscode_markdown_desktop: "code.desktop"
desktop_apps_markdown_mime_types:
  - "text/markdown"
  - "text/x-markdown"
  - "application/x-markdown"
desktop_apps_chrome_pdf_desktop: "google-chrome.desktop"
desktop_apps_pdf_mime_types:
  - "application/pdf"
desktop_apps_catalog:
  - id: "com.google.Chrome"
    fallback:
      deb: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
      package_name: "google-chrome-stable"
  - id: "org.mozilla.firefox"
  - id: "io.github.celluloid_player.Celluloid"
    fallback:
      apt: "celluloid"
  - id: "org.gnome.gThumb"
    fallback:
      apt: "gthumb"
  - id: "com.visualstudio.code"
    flatpak_preferred: false
    fallback:
      apt_key_url: "https://packages.microsoft.com/keys/microsoft.asc"
      apt_key_dest: "/usr/share/keyrings/microsoft.gpg"
      apt_key_dearmor: true
      apt_source_dest: "/etc/apt/sources.list.d/vscode.sources"
      apt_source_legacy_paths:
        - "/etc/apt/sources.list.d/fallback-com-visualstudio-code.list"
        - "/etc/apt/sources.list.d/vscode.list"
      apt_source_content: |
        Types: deb
        URIs: https://packages.microsoft.com/repos/code
        Suites: stable
        Components: main
        Architectures: amd64,arm64,armhf
        Signed-By: /usr/share/keyrings/microsoft.gpg
      apt_package: "code"
      validate_path: "/usr/bin/code"
  - id: "intellij-idea-ultimate"
  # Sublime Text 4. O ID antigo (com.sublimetext.three) e Sublime Text 3, EOL
  # desde 2019: o Flatpak atualizava, mas dentro de uma branch parada.
  - id: "com.sublimehq.SublimeText"
    fallback:
      apt_key_url: "https://download.sublimetext.com/sublimehq-pub.gpg"
      apt_key_dest: "/etc/apt/keyrings/sublimehq.gpg"
      apt_repo: "deb [signed-by=/etc/apt/keyrings/sublimehq.gpg] https://download.sublimetext.com/ apt/stable/"
      apt_package: "sublime-text"
  - id: "com.getpostman.Postman"
    fallback:
      deb: "{{ postman_deb_url }}"
      package_name: "{{ postman_deb_package_name }}"
      tarball: "https://dl.pstmn.io/download/latest/linux64"
      install_dir: "/opt"
      installed_dir: "/opt/Postman"
      validate_path: "/opt/Postman/Postman"
      bin_path: "/usr/local/bin/postman"
      bin_target: "/opt/Postman/Postman"
      desktop_entry: "/usr/share/applications/postman.desktop"
      desktop_name: "Postman"
      desktop_exec: "/opt/Postman/Postman"
      desktop_icon: "/opt/Postman/app/resources/app/assets/icon.png"
  - id: "com.discordapp.Discord"
    fallback:
      deb: "https://discord.com/api/download?platform=linux&format=deb"
      package_name: "discord"
  - id: "com.spotify.Client"
    fallback:
      apt_key_url: "https://download.spotify.com/debian/pubkey_0D811D58.gpg"
      apt_key_dest: "/etc/apt/keyrings/spotify.gpg"
      apt_repo: "deb [signed-by=/etc/apt/keyrings/spotify.gpg] http://repository.spotify.com stable non-free"
      apt_package: "spotify-client"
  - id: "org.ferdium.Ferdium"
    fallback:
      apt: "ferdium"
  - id: "org.telegram.desktop"
    fallback:
      apt: "telegram-desktop"
  - id: "org.gnome.Snapshot"
    fallback:
      apt: "cheese"
  - id: "io.github.mfat.sshpilot"
  - id: "org.kde.audiotube"

# Kazam2 (fork mantido do Kazam): gravador de tela X11-native.
#
# Por que nao um Flatpak: Kooha e os gravadores modernos gravam via portal
# ScreenCast do XDG, e nenhum backend de portal do Cinnamon implementa esse
# servico numa sessao X11 - eles abrem e falham ao gravar. O Kazam2 captura
# direto por python-xlib/GStreamer, entao funciona.
#
# Por que do git: nao existe .deb, AppImage nem Flatpak. O snapcraft.yaml e
# inutil aqui (o role common remove e bloqueia o snapd) e o PyPI esta parado em
# 2024-08, dois anos atras do master. Instalar do git segue o mesmo padrao que o
# role shell ja usa para ble.sh e bash-git-prompt: a cada execucao comparamos o
# commit do master com o instalado, o que faz o timer de self-update manter isso
# atualizado sozinho, sem interacao.
desktop_apps_kazam2_enable: true
desktop_apps_kazam2_repo: "https://github.com/henrywoo/kazam"
desktop_apps_kazam2_api_repo: "henrywoo/kazam"
# Aceita branch, tag ou SHA. Fixe num commit se o master regredir - a API
# /commits/<ref> resolve qualquer um dos tres.
desktop_apps_kazam2_branch: "master"
desktop_apps_kazam2_venv: "/opt/kazam2"
desktop_apps_kazam2_wrapper: "/usr/local/bin/kazam"
desktop_apps_kazam2_icon: "/usr/share/pixmaps/kazam2.png"
desktop_apps_kazam2_desktop_entry: "/usr/share/applications/kazam2.desktop"
desktop_apps_kazam2_apt_packages:
  # Runtime: GTK3, GStreamer e X11 vem todos do sistema, para nao compilar
  # PyGObject/pycairo/dbus-python dentro do venv a cada atualizacao.
  - python3-gi
  - python3-gi-cairo
  - python3-cairo
  - python3-dbus
  - python3-xlib
  - python3-xdg
  - python3-venv
  - gir1.2-gtk-3.0
  - gir1.2-gst-plugins-base-1.0
  - gstreamer1.0-plugins-good
  - gstreamer1.0-pulseaudio
  # Build: o setup.py usa DistUtilsExtra, que por sua vez chama intltool-update.
  - python3-distutils-extra
  - intltool

# Instancias isoladas do Telegram Desktop.
# O cliente oficial e nativo (Qt/C++, GPLv3) e aceita 3 contas por instancia no
# plano gratuito. Para ir alem, as flags oficiais -many (desliga o lock de
# instancia unica) e -workdir (diretorio de dados proprio) dao instancias
# totalmente independentes, sem nenhuma feature paga.
# A instancia "principal" usa o workdir padrao (TelegramDesktop), o mesmo do
# launcher que o Flatpak exporta - assim as duas compartilham a sessao em vez
# de duplicar dados.
desktop_apps_telegram_enable: true
desktop_apps_telegram_id: "org.telegram.desktop"
desktop_apps_telegram_instances:
  - slug: "principal"
    name: "Telegram"
    workdir: "TelegramDesktop"
  - slug: "conta2"
    name: "Telegram (Conta 2)"
    workdir: "TelegramConta2"
  - slug: "conta3"
    name: "Telegram (Conta 3)"
    workdir: "TelegramConta3"

desktop_apps_intellij_base:
  id: "intellij-idea-ultimate"
  flatpak_preferred: false
  fallback:
    install_dir: "/opt"
    installed_dir: "/opt/intellij-idea-ultimate"
    validate_path: "/opt/intellij-idea-ultimate/bin/idea"
    version_file: "/opt/intellij-idea-ultimate/product-info.json"
    version_json_key: "version"
    bin_path: "/usr/local/bin/intellij-idea-ultimate"
    bin_target: "/opt/intellij-idea-ultimate/bin/idea"
    desktop_entry: "/usr/share/applications/intellij-idea-ultimate.desktop"
    desktop_name: "IntelliJ IDEA Ultimate"
    desktop_exec: "/opt/intellij-idea-ultimate/bin/idea"
    desktop_icon: "/opt/intellij-idea-ultimate/bin/idea.svg"
