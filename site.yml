---
- name: Setup Linux Mint (Cinnamon) para desenvolvimento completo
  hosts: local
  become: yes
  roles:
    # As tags espelham o nome da role para permitir execucao parcial
    # (--tags/--skip-tags), inclusive no timer de self-update.
    - role: common
      tags: [common]
    - role: cinnamon
      tags: [cinnamon]
    - role: shell_env
      tags: [shell_env]
    - role: shell
      tags: [shell]
    - role: dev_tools
      tags: [dev_tools]
    - role: devops
      tags: [devops]
    - role: openclaw
      when: openclaw_enable | default(true) | bool
      tags: [openclaw]
    - role: desktop_apps
      tags: [desktop_apps]
    - role: projects
      when: projects_enable | default(true) | bool
      tags: [projects]
    - role: ai_assistant
      when: ai_assistant_enable | default(true) | bool
      tags: [ai_assistant]
    - role: syncthing
      when: syncthing_enable | default(true) | bool
      tags: [syncthing]
    - role: gdrive
      when: gdrive_enable | default(true) | bool
      tags: [gdrive]
    - role: auto_updates
      when: auto_updates_enable | default(true) | bool
      tags: [auto_updates]
    - role: cleanup_apps
      tags: [cleanup_apps]
    - role: onboarding
      tags: [onboarding]
